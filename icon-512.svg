<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="crystalBg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="crystalRim512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="crystalSheen512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="bracketsGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Base cristal zafiro traslúcido -->
  <rect x="10" y="10" width="492" height="492" rx="112" fill="url(#crystalBg512)" stroke="url(#crystalRim512)" stroke-width="8"/>
  <!-- Reflejo especular superior de cristal -->
  <rect x="36" y="32" width="440" height="192" rx="86" fill="url(#crystalSheen512)"/>
  <!-- Bisel interior cristalino -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#93c5fd" stroke-opacity="0.22" stroke-width="5"/>
  <!-- Corchete Izquierdo [ -->
  <path d="M 170 144 L 124 144 L 124 368 L 170 368" fill="none" stroke="url(#bracketsGrad512)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corchete Derecho ] -->
  <path d="M 342 144 L 388 144 L 388 368 L 342 368" fill="none" stroke="url(#bracketsGrad512)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Letra B central -->
  <text x="256" y="304" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="172" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
</svg>
