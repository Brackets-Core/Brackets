# Configuración de menús para Vault Personal
# Diseñado para hábitos, reflexiones, ideas y proyectos personales.

menus:
  main:
    title: "M E N U  P R I N C I P A L  ( P E R S O N A L )"
    items:
      - id: daily_hub
        label: "Mi Dia (Bitacora y Habitos)"
        keys: ["1", "d"]
        action: exec
        command: open_daily_hub
        context_tag: bitacoras_enabled

      - id: project_backlog
        label: "Ideas y Proyectos Personales"
        keys: ["2", "i", "p"]
        action: exec
        command: open_project_backlog

      - id: notes_crud
        label: "Diario y Notas Personales (CRUD)"
        keys: ["3", "n"]
        action: exec
        command: open_notes_crud

      - id: generation
        label: "Bitacoras Semanales / Mensuales"
        keys: ["4", "b"]
        action: exec
        command: open_generation
        context_tag: bitacoras_enabled

      - id: consolidation
        label: "Consolidar Recuerdos / Historico"
        keys: ["5", "c"]
        action: exec
        command: open_consolidation
        context_tag: bitacoras_enabled

      - id: files
        label: "Documentos y Categorias"
        keys: ["6", "f"]
        action: exec
        command: open_file_management

      - id: tools
        label: "Utilidades (Pomodoro / Enfoque)"
        keys: ["7", "t"]
        action: exec
        command: open_tools

      - id: settings
        label: "Configuracion del Vault"
        keys: ["8", "s"]
        action: exec
        command: open_settings

      - id: exit
        label: "Salir"
        keys: ["0", "q", "x"]
        action: exec
        command: exit

  generation:
    title: "B I T A C O R A S  P E R S O N A L E S"
    items:
      - id: weekly_auto
        label: "Nueva semana"
        keys: ["1", "w"]
        action: exec
        command: create_weekly
      - id: monthly
        label: "Nuevo mes"
        keys: ["2", "m"]
        action: exec
        command: create_monthly
      - id: back
        label: "Volver al menu principal"
        keys: ["0", "v", "b"]
        action: exec
        command: back

  consolidation:
    title: "C O N S O L I D A C I O N"
    items:
      - id: consolidate_month
        label: "Consolidar mes"
        keys: ["1", "m"]
        action: exec
        command: consolidate_month
      - id: consolidate_year
        label: "Consolidar anio"
        keys: ["2", "y"]
        action: exec
        command: consolidate_year
      - id: back
        label: "Volver al menu principal"
        keys: ["0", "v", "b"]
        action: exec
        command: back

  file_management:
    title: "D O C U M E N T O S  P E R S O N A L E S"
    items:
      - id: list
        label: "Listar documentos recientes"
        keys: ["1", "l"]
        action: exec
        command: list_files
      - id: categories
        label: "Categorias personales"
        keys: ["2", "g"]
        action: exec
        command: manage_categories
      - id: back
        label: "Volver al menu principal"
        keys: ["0", "v", "b"]
        action: exec
        command: back

  tools:
    title: "U T I L I D A D E S"
    items:
      - id: pomodoro
        label: "Sesion de Enfoque (Pomodoro)"
        keys: ["1", "p"]
        action: exec
        command: tool_pomodoro
      - id: back
        label: "Volver al menu principal"
        keys: ["0", "v", "b"]
        action: exec
        command: back

  configuration:
    title: "C O N F I G U R A C I O N"
    items:
      - id: view
        label: "Ver configuracion actual"
        keys: ["1", "v"]
        action: exec
        command: config_view
      - id: holidays
        label: "Gestionar dias festivos / eventos"
        keys: ["2", "f"]
        action: exec
        command: config_holidays
      - id: vacations
        label: "Vacaciones y viajes"
        keys: ["3", "a"]
        action: exec
        command: config_vacations
      - id: back
        label: "Volver al menu principal"
        keys: ["0", "b", "v"]
        action: exec
        command: back

  daily_tasks:
    title: "📋 G E S T I Ó N  D E  T A R E A S  Y  H Á B I T O S"
    items:
      - id: new_task
        label: "➕ Nueva Tarea HOY"
        keys: ["1", "n"]
        action: exec
        command: new_task
      - id: new_habit
        label: "🌱 Registrar Hábito HOY"
        keys: ["2", "h"]
        action: exec
        command: new_habit
      - id: toggle_task
        label: "✅ Marcar Tarea / Hábito (completar / reactivar)"
        keys: ["3", "c", "m"]
        action: exec
        command: toggle_task
      - id: delete_task
        label: "🗑️  Borrar Tarea de la Bitácora (eliminar)"
        keys: ["4", "d", "b"]
        action: exec
        command: delete_task
      - id: new_topic
        label: "🎯 Crear nuevo Objetivo Semanal"
        keys: ["5", "t"]
        action: exec
        command: new_topic
      - id: new_week_task
        label: "📋 Nueva Tarea SEMANAL (sin día fijo)"
        keys: ["6", "w"]
        action: exec
        command: new_week_task
      - id: schedule_topic
        label: "➡️  Agendar Tarea / Objetivo a HOY"
        keys: ["7", "a"]
        action: exec
        command: schedule_topic
      - id: edit_task
        label: "✏️  Editar Tarea (texto / categoría)"
        keys: ["8", "e"]
        action: exec
        command: edit_task
      - id: recurring_menu
        label: "🔄 Hábitos y Tareas Recurrentes"
        keys: ["9", "r"]
        action: exec
        command: recurring_menu
      - id: sync_markdown
        label: "🔄 Sincronizar Semana Actual (.md ➔ YAML)"
        keys: ["10", "y", "sync"]
        action: exec
        command: sync_markdown
      - id: run_pomodoro
        label: "🍅 Iniciar Sesión de Enfoque (Pomodoro)"
        keys: ["11", "k", "pomo"]
        action: exec
        command: run_pomodoro
      - id: cancel_task
        label: "❌ Cancelar / Tachar Tarea"
        keys: ["12", "x", "cancel"]
        action: exec
        command: cancel_task

  recurring:
    title: "🔄 G E S T I Ó N  D E  R E C U R R E N T E S  Y  R E U N I O N E S"
    items:
      - id: new_rec
        label: "➕ Nueva Tarea / Reunión Recurrente"
        keys: ["1", "n", "+"]
        action: exec
        command: new_rec
      - id: toggle_rec
        label: "⏯️  Pausar / Activar Recurrencia"
        keys: ["2", "p", "t"]
        action: exec
        command: toggle_rec
      - id: delete_rec
        label: "🗑️  Eliminar Definición Recurrente"
        keys: ["3", "d"]
        action: exec
        command: delete_rec
      - id: sync_rec
        label: "⚡ Inyectar / Sincronizar en esta semana"
        keys: ["4", "s"]
        action: exec
        command: sync_rec

  definitions:
    title: "🔗 G E S T I Ó N  D E  D E F I N I C I O N E S  Y  E N L A C E S"
    items:
      - id: new_jira_def
        label: "🎫 Nueva Definición Jira (ej: PROJ-1234)"
        keys: ["1", "j"]
        action: exec
        command: new_jira_def
      - id: new_custom_def
        label: "🔗 Nueva Definición Personalizada (ID + URL)"
        keys: ["2", "c"]
        action: exec
        command: new_custom_def
      - id: list_defs
        label: "📋 Listar Definiciones registradas"
        keys: ["3", "l"]
        action: exec
        command: list_defs
      - id: delete_def
        label: "🗑️  Eliminar Definición"
        keys: ["4", "d"]
        action: exec
        command: delete_def

  sync_markdown:
    title: "🔄 S I N C R O N I Z A C I Ó N  M A R K D O W N  ➔  Y A M L"
    items:
      - id: sync_specific_week
        label: "📅 Sincronizar una semana específica"
        keys: ["1", "s"]
        action: exec
        command: sync_specific_week
      - id: sync_all_weeks
        label: "🌐 Sincronizar TODAS las semanas del Vault"
        keys: ["2", "t", "all"]
        action: exec
        command: sync_all_weeks
