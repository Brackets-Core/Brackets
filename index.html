<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brackets Web Hub</title>
  
  <meta name="description" content="Sistema Operativo Personal de Productividad y Bitácoras Semanales">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  
  <!-- PWA & Apple Touch Icons -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon-192.svg">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brackets">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <button id="btnHamburger" class="btn-icon btn-hamburger" type="button" title="Menú principal (Acciones CLI)" aria-label="Menú principal" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <img src="icon-192.svg" alt="Brackets Logo" class="brand-logo">
        <h1 class="brand-title">Brackets</h1>
      </div>

      <div class="header-controls">
        <button id="btnPwaInstall" class="btn-pwa-install" style="display: none;" title="Instalar Brackets como App de escritorio">
          📲 Instalar App
        </button>

        <select id="vaultSelect" class="vault-select" title="Seleccionar Vault (Local o GitHub)">
          <!-- Opciones dinámicas inyectadas por JS -->
        </select>

        <button id="btnGitHubConfig" class="btn-storage-mode" type="button" title="Configurar GitHub REST API v3 (Token PAT y Repositorios Remotos)">
          ☁️ GitHub
        </button>

        <button id="btnSync" class="btn-icon" title="Sincronizar Markdown y YAML">
          🔄
        </button>
      </div>
    </header>

    <!-- Hamburger Menu Drawer & Backdrop -->
    <div id="hamburgerBackdrop" class="hamburger-backdrop" style="display: none;"></div>
    <aside id="hamburgerDrawer" class="hamburger-drawer" style="display: none;" aria-label="Menú principal de opciones">
      <div class="hamburger-drawer-header">
        <div class="hamburger-drawer-title">
          <img src="icon-192.svg" alt="Brackets Logo" class="drawer-logo">
          <span>Menú de Brackets</span>
        </div>
        <button id="btnCloseHamburger" class="btn-drawer-close" type="button" aria-label="Cerrar menú">✕</button>
      </div>
      <div id="hamburgerMenuContent" class="hamburger-menu-content">
        <!-- Grupos e ítems renderizados dinámicamente desde menu_config.yaml -->
      </div>
      <div class="hamburger-drawer-footer">
        <button id="btnSoundToggle" class="drawer-sound-btn" type="button" title="Alternar efectos de sonido" aria-label="Alternar sonidos">
          <span class="drawer-sound-icon">🔊</span>
          <span class="drawer-sound-label">Sonido: Activado</span>
        </button>
      </div>
    </aside>

    <!-- Week Banner -->
    <div class="week-banner">
      <div class="week-nav-group">
        <button id="btnPrevWeek" class="btn-week-arrow" type="button" title="Semana anterior">◀</button>
        <div id="weekBadge" class="week-badge" title="Clic para cambiar de semana">
          🗓️ Cargando semana...
        </div>
        <button id="btnNextWeek" class="btn-week-arrow" type="button" title="Semana siguiente">▶</button>
      </div>
    </div>

    <!-- Days Strip / Carousel -->
    <div id="daysStrip" class="days-strip">
      <!-- Días inyectados dinámicamente -->
    </div>

    <!-- Container for Reorderable Sections -->
    <div id="sectionsContainer" class="sections-container">
      <!-- Today Tasks Section -->
      <section class="collapsible-section" data-section="today-tasks">
        <div class="section-header-row">
          <span class="section-drag-handle" draggable="true" title="Arrastrar para mover sección">⋮⋮</span>
          <button class="section-header-btn" type="button" aria-expanded="true" aria-controls="todayTasksContent">
            <h2 class="section-title">
              <span>📋</span> Tareas de Hoy
              <span id="todayCountBadge" class="task-count-badge empty">[0/0]</span>
              <span role="button" tabindex="0" class="btn-section-quick-add" data-quick-add="today_task" title="Añadir Tarea de Hoy" aria-label="Añadir Tarea de Hoy">+</span>
            </h2>
            <span class="collapse-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
        </div>
      <div id="todayTasksContent" class="section-content">
        <div id="todayTasksList" class="task-list">
          <!-- Tareas inyectadas dinámicamente -->
        </div>
      </div>
    </section>

      <!-- Week Topics Section -->
      <section class="collapsible-section" data-section="week-topics">
        <div class="section-header-row">
          <span class="section-drag-handle" draggable="true" title="Arrastrar para mover sección">⋮⋮</span>
          <button class="section-header-btn" type="button" aria-expanded="true" aria-controls="weekTopicsContent">
            <h2 class="section-title">
              <span>🎯</span> Topics de la Semana
              <span id="topicsCountBadge" class="task-count-badge empty">[0]</span>
              <span role="button" tabindex="0" class="btn-section-quick-add" data-quick-add="topic" title="Añadir Topic de la Semana" aria-label="Añadir Topic de la Semana">+</span>
            </h2>
            <span class="collapse-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
        </div>
      <div id="weekTopicsContent" class="section-content">
        <div id="topicsContainer" class="topics-container">
          <!-- Topics inyectados dinámicamente -->
        </div>
      </div>
    </section>

      <!-- Week Tasks Section -->
      <section class="collapsible-section" data-section="week-tasks">
        <div class="section-header-row">
          <span class="section-drag-handle" draggable="true" title="Arrastrar para mover sección">⋮⋮</span>
          <button class="section-header-btn" type="button" aria-expanded="true" aria-controls="weekTasksContent">
            <h2 class="section-title">
              <span>⏳</span> Tareas de la Semana (Sin día fijo)
              <span id="weekCountBadge" class="task-count-badge empty">[0/0]</span>
              <span role="button" tabindex="0" class="btn-section-quick-add" data-quick-add="week_task" title="Añadir Tarea de la Semana" aria-label="Añadir Tarea de la Semana">+</span>
            </h2>
            <span class="collapse-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
        </div>
      <div id="weekTasksContent" class="section-content">
        <div id="weekTasksList" class="task-list">
          <!-- Tareas semanales inyectadas dinámicamente -->
        </div>
      </div>
    </section>

      <!-- Week Notes Section -->
      <section class="collapsible-section" data-section="week-notes">
        <div class="section-header-row">
          <span class="section-drag-handle" draggable="true" title="Arrastrar para mover sección">⋮⋮</span>
          <button class="section-header-btn" type="button" aria-expanded="true" aria-controls="weekNotesContent">
            <h2 class="section-title">
              <span>📝</span> Notas de la Semana
              <span id="notesCountBadge" class="task-count-badge empty">[0]</span>
              <span role="button" tabindex="0" class="btn-section-quick-add" data-quick-add="note" title="Añadir Nota de la Semana" aria-label="Añadir Nota de la Semana">+</span>
            </h2>
            <span class="collapse-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
        </div>
      <div id="weekNotesContent" class="section-content">
        <div id="notesContainer" class="notes-container">
          <!-- Notas inyectadas dinámicamente -->
        </div>
      </div>
    </section>

      <!-- Week Definitions Section -->
      <section class="collapsible-section" data-section="week-definitions">
        <div class="section-header-row">
          <span class="section-drag-handle" draggable="true" title="Arrastrar para mover sección">⋮⋮</span>
          <button class="section-header-btn" type="button" aria-expanded="true" aria-controls="weekDefsContent">
            <h2 class="section-title">
              <span>🎫</span> Definiciones y Enlaces
              <span id="defsCountBadge" class="task-count-badge empty">[0]</span>
              <span role="button" tabindex="0" class="btn-section-quick-add" data-quick-add="definition" title="Añadir Definición o Enlace" aria-label="Añadir Definición o Enlace">+</span>
            </h2>
            <span class="collapse-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
        </div>
      <div id="weekDefsContent" class="section-content">
        <div id="definitionsContainer" class="definitions-container">
          <!-- Definiciones inyectadas dinámicamente -->
        </div>
      </div>
    </section>
  </div>
  <!-- End sectionsContainer -->

    <!-- Footer -->
    <footer class="app-footer">
      <span>Brackets v1.0 • Sistema Operativo de Productividad</span>
      <span>Local-First & Multi-Vault</span>
    </footer>
  </div>

  <!-- Floating Action Button (FAB) + Speed Dial -->
  <div id="fabBackdrop" class="fab-backdrop" style="display: none;"></div>
  <div id="fabContainer" class="fab-container">
    <div id="fabMenu" class="fab-menu" style="display: none;" role="menu" aria-label="Crear nuevo elemento">
      <button type="button" class="fab-menu-item" data-fab-action="today_task" role="menuitem">
        <span class="fab-menu-label">Tarea de Hoy</span>
        <span class="fab-menu-icon">📋</span>
      </button>
      <button type="button" class="fab-menu-item" data-fab-action="week_task" role="menuitem">
        <span class="fab-menu-label">Tarea de Semana</span>
        <span class="fab-menu-icon">⏳</span>
      </button>
      <button type="button" class="fab-menu-item" data-fab-action="topic" role="menuitem">
        <span class="fab-menu-label">Topic</span>
        <span class="fab-menu-icon">🎯</span>
      </button>
      <button type="button" class="fab-menu-item" data-fab-action="note" role="menuitem">
        <span class="fab-menu-label">Nota</span>
        <span class="fab-menu-icon">📝</span>
      </button>
      <button type="button" class="fab-menu-item" data-fab-action="definition" role="menuitem">
        <span class="fab-menu-label">Definición / Enlace</span>
        <span class="fab-menu-icon">🎫</span>
      </button>
    </div>
    <button id="btnFabMain" class="fab-main-btn" type="button" aria-label="Crear elemento" aria-expanded="false" title="Crear nuevo elemento (+)">
      <svg class="fab-plus-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <!-- Toast Notifications Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Universal Modal Overlay for CLI Actions -->
  <div id="appModalOverlay" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle" class="modal-title">Acción</h3>
        <button id="btnCloseModal" class="btn-modal-close" type="button" aria-label="Cerrar">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Floating Pomodoro Timer Widget -->
  <div id="pomodoroBackdrop" class="pomodoro-backdrop" style="display: none;"></div>
  <div id="pomodoroFloatingWidget" class="pomodoro-floating-widget" style="display: none;">
    <div class="pomo-header" id="pomoDragHandle">
      <span class="pomo-title">🍅 Pomodoro Focus</span>
      <div class="pomo-header-btns">
        <button id="btnPomoBlurToggle" class="btn-pomo-icon" type="button" title="Difuminar fondo (Modo Focus)">🌫️</button>
        <button id="btnPomoMinimize" class="btn-pomo-icon" type="button" title="Minimizar / Expandir">_</button>
        <button id="btnPomoClose" class="btn-pomo-icon" type="button" title="Cerrar Pomodoro">✕</button>
      </div>
    </div>
    <div id="pomoBody" class="pomo-body">
      <div class="pomo-mode-tabs">
        <button type="button" class="btn-pomo-mode active" data-minutes="25" data-mode="work">Trabajo (25m)</button>
        <button type="button" class="btn-pomo-mode" data-minutes="5" data-mode="short">Pausa (5m)</button>
        <button type="button" class="btn-pomo-mode" data-minutes="15" data-mode="long">Larga (15m)</button>
      </div>
      <div id="pomoTimeDisplay" class="pomo-time-display">25:00</div>
      <select id="pomoTaskSelect" class="pomo-task-select">
        <option value="">🎯 Sin tarea específica seleccionada</option>
      </select>
      <div class="pomo-controls">
        <button id="btnPomoStartPause" type="button" class="btn-pomo-primary">▶ Iniciar</button>
        <button id="btnPomoReset" type="button" class="btn-pomo-secondary">↺ Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="github_adapter.js"></script>
  <script src="app.js"></script>
</body>
</html>
